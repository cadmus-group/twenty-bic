[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && yarn install --immutable && npx nx run twenty-front:build"

[deploy]
startCommand = "npx serve -s packages/twenty-front/build -l $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
